<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yokos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; overflow: hidden; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="app-wrapper" class="relative w-full h-[100dvh] sm:h-[850px] sm:w-[390px] sm:rounded-[40px] sm:border-[6px] sm:border-gray-800 bg-[#121212] text-white flex flex-col">
        
        <div id="screen-login" class="absolute inset-0 bg-[#121212] z-[100] flex flex-col items-center justify-center p-6">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#8A2BE2] to-[#00BFFF] mb-8">Yokos</h1>
            
            <div class="w-full space-y-4 max-w-sm">
                <input id="login-pseudo" type="text" placeholder="Pseudo" class="w-full bg-[#1E1E1E] border border-white/10 rounded-xl px-4 py-4 text-center outline-none">
                <input id="login-pin" type="password" maxlength="4" placeholder="Code PIN (4 chiffres)" class="w-full bg-[#1E1E1E] border border-white/10 rounded-xl px-4 py-4 text-center outline-none">
                
                <div class="flex gap-3 pt-2">
                    <button id="btn-login" class="flex-1 py-4 rounded-xl bg-[#1E1E1E] border border-white/10 font-bold">Connexion</button>
                    <button id="btn-register" class="flex-1 py-4 rounded-xl bg-[#8A2BE2] font-bold">Créer</button>
                </div>
            </div>

            <div id="login-feedback" class="mt-8 px-4 py-3 rounded-xl border border-transparent w-full max-w-sm text-center text-sm font-medium hidden"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const feedbackEl = document.getElementById('login-feedback');
        
        let auth, db;

        // Fonction pour logger et afficher l'erreur
        const abortInit = (msg) => {
            console.error("DEBUG FIREBASE:", msg);
            feedbackEl.innerText = msg;
            feedbackEl.classList.remove('hidden');
        };

        const initFirebase = () => {
            try {
                // 1. Vérification de l'existence de la variable globale
                if (typeof __firebase_config === 'undefined') {
                    return abortInit("Erreur : Variable __firebase_config non définie.");
                }

                // 2. Tente le parsing
                let config;
                try {
                    config = JSON.parse(__firebase_config);
                } catch (e) {
                    return abortInit("Erreur : Format JSON invalide dans __firebase_config.");
                }

                // 3. Initialisation
                const app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);
                
                // Auth auto
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
                } else {
                    signInAnonymously(auth).catch(e => console.log("Auth Anonyme:", e));
                }

            } catch (e) {
                abortInit("Erreur critique : " + e.message);
            }
        };

        function showFeedback(msg) {
            feedbackEl.innerText = msg;
            feedbackEl.classList.remove('hidden');
            feedbackEl.className = "mt-8 px-4 py-3 rounded-xl bg-red-500/10 text-red-400 border-red-500/20 w-full max-w-sm text-center text-sm";
        }

        async function handleAuth(isRegister) {
            if (!auth) return showFeedback("Le système attend les serveurs...");
            
            const pseudo = document.getElementById('login-pseudo').value.trim().toLowerCase();
            const pin = document.getElementById('login-pin').value.trim();

            if (!pseudo || !pin) return showFeedback("Pseudo et PIN requis.");

            try {
                if (isRegister) {
                    const userCred = await createUserWithEmailAndPassword(auth, `${pseudo}@yokos.app`, `${pin}yokos`);
                    await setDoc(doc(db, 'users', userCred.user.uid), { uid: userCred.user.uid, pseudo });
                } else {
                    await signInWithEmailAndPassword(auth, `${pseudo}@yokos.app`, `${pin}yokos`);
                }
            } catch (err) {
                showFeedback("Erreur : " + (err.code || "Problème inconnu"));
            }
        }

        document.getElementById('btn-register').onclick = () => handleAuth(true);
        document.getElementById('btn-login').onclick = () => handleAuth(false);

        // Lancement
        initFirebase();
    </script>
</body>
</html>
