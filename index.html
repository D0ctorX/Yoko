<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yoko</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'yoko-bg': '#121212',
                        'yoko-surface': '#1E1E1E',
                        'yoko-primary': '#8A2BE2',
                        'yoko-secondary': '#00BFFF',
                    }
                }
            }
        }
    </script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .neon-text-primary { text-shadow: 0 0 10px rgba(138, 43, 226, 0.7); }
        .neon-glow-primary { box-shadow: 0 0 15px rgba(138, 43, 226, 0.6); }
        body { -webkit-user-select: none; user-select: none; background-color: #000; overflow: hidden; }
        
        @keyframes flashPing {
            0% { background-color: #121212; }
            10% { background-color: #8A2BE2; }
            100% { background-color: #121212; }
        }
        .flash-active { animation: flashPing 0.6s ease-out 3; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="app-wrapper" class="relative w-full h-[100dvh] sm:h-[850px] sm:w-[390px] sm:rounded-[40px] sm:border-[6px] sm:border-gray-800 bg-yoko-bg text-white overflow-hidden shadow-2xl flex flex-col transition-colors duration-300">
        
        <!-- ÉCRAN DE CONNEXION / INSCRIPTION -->
        <div id="screen-login" class="absolute inset-0 bg-yoko-bg z-[100] flex flex-col items-center justify-center p-6 transition-transform duration-500">
            <i class="ph-fill ph-lightning text-yoko-primary text-6xl mb-4 neon-glow-primary rounded-full"></i>
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-yoko-primary to-yoko-secondary bg-clip-text text-transparent mb-2">Yoko</h1>
            <p class="text-gray-400 text-center text-sm mb-10">Le réseau rapide. Zéro mail. Zéro trace.</p>
            
            <div class="w-full space-y-4 max-w-sm">
                <input id="login-pseudo" type="text" placeholder="Pseudo (sans espace)" class="w-full bg-yoko-surface border border-white/10 rounded-xl px-4 py-4 text-white font-medium focus:outline-none focus:border-yoko-primary text-center tracking-wider">
                <input id="login-pin" type="password" inputmode="numeric" maxlength="4" placeholder="Code PIN (4 chiffres)" class="w-full bg-yoko-surface border border-white/10 rounded-xl px-4 py-4 text-white font-bold text-2xl tracking-[0.5em] focus:outline-none focus:border-yoko-primary text-center">
                
                <div class="flex gap-3 pt-2">
                    <button id="btn-login" class="flex-1 py-4 rounded-xl bg-yoko-surface border border-white/10 font-bold text-sm hover:bg-white/5 transition-colors">
                        Se connecter
                    </button>
                    <button id="btn-register" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-yoko-primary to-yoko-secondary font-bold text-sm shadow-[0_0_20px_rgba(138,43,226,0.4)] hover:scale-[1.02] transition-transform">
                        Créer un compte
                    </button>
                </div>
            </div>
            <p id="login-error" class="text-red-400 mt-6 text-sm font-semibold text-center"></p>
        </div>

        <!-- HEADER PRINCIPAL -->
        <header id="main-header" class="flex justify-between items-center px-6 py-5 z-10 bg-yoko-bg/90 backdrop-blur-md border-b border-white/5">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-lightning text-yoko-secondary text-2xl"></i>
                <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-yoko-primary to-yoko-secondary bg-clip-text text-transparent">Yoko</h1>
                <button id="btn-open-profile" class="ml-2 relative w-9 h-9 rounded-full border-[1.5px] border-yoko-primary/50 overflow-hidden cursor-pointer">
                    <img id="header-avatar" src="https://placehold.co/100/1E1E1E/8A2BE2?text=?" alt="Profil" class="w-full h-full object-cover">
                </button>
            </div>
        </header>

        <!-- TABS (Messages / Stories) -->
        <div class="flex justify-center gap-8 py-3 text-sm font-semibold border-b border-white/5 z-10 bg-yoko-bg">
            <span id="tab-messages" class="cursor-pointer text-white border-b-2 border-yoko-primary pb-1 px-2">Messages</span>
            <span id="tab-stories" class="cursor-pointer text-gray-500 px-2">Stories</span>
        </div>

        <!-- SWIPE CONTAINER -->
        <div class="flex flex-1 overflow-x-auto snap-x snap-mandatory hide-scrollbar" id="swipe-container">
            
            <!-- SCREEN 1: LISTE DES CHATS -->
            <div class="w-full h-full flex-shrink-0 snap-center relative flex flex-col">
                <div id="chats-list" class="flex-1 overflow-y-auto pb-24 px-4 pt-4 space-y-2">
                    <!-- Rempli par JS -->
                </div>

                <div class="absolute bottom-6 right-6 flex flex-col gap-4 z-20 items-center">
                    <button id="btn-open-users" class="w-14 h-14 rounded-full bg-gradient-to-r from-yoko-primary to-yoko-secondary text-white flex items-center justify-center text-2xl shadow-[0_4px_20px_rgba(138,43,226,0.5)] active:scale-95 transition-transform">
                        <i class="ph ph-plus"></i>
                    </button>
                </div>
            </div>

            <!-- SCREEN 2: STORIES -->
            <div class="w-full h-full flex-shrink-0 snap-center flex flex-col px-4 pt-4 pb-10">
                <p class="text-xs text-gray-500 mb-4 font-medium uppercase tracking-wider text-center">Éphémère (24h)</p>
                <div class="grid grid-cols-2 gap-3 flex-1 overflow-y-auto hide-scrollbar pb-10">
                    <div class="relative rounded-2xl overflow-hidden aspect-[9/16] bg-yoko-surface border border-white/10 flex flex-col items-center justify-center">
                        <i class="ph ph-plus text-xl text-gray-400 mb-2"></i>
                        <span class="text-sm font-semibold text-gray-300">Bientôt...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ÉCRAN: SALON DE DISCUSSION -->
        <div id="screen-chat" class="absolute inset-0 bg-yoko-bg z-[60] flex flex-col transform translate-x-full transition-transform duration-300">
            <div class="flex items-center gap-3 px-4 py-4 border-b border-white/5 bg-yoko-surface/80 backdrop-blur-md">
                <button id="btn-close-chat" class="p-2 text-gray-400 hover:text-white"><i class="ph ph-caret-left text-2xl"></i></button>
                <img id="chat-header-avatar" src="" class="w-10 h-10 rounded-full object-cover">
                <div class="flex-1 min-w-0">
                    <h3 id="chat-header-name" class="font-bold text-white truncate">...</h3>
                </div>
                <button id="btn-send-ping" class="w-10 h-10 rounded-full bg-yoko-primary/20 text-yoko-primary flex items-center justify-center border border-yoko-primary/50 shadow-[0_0_10px_rgba(138,43,226,0.3)] active:bg-yoko-primary active:text-white transition">
                    <i class="ph-fill ph-lightning text-xl"></i>
                </button>
            </div>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                <!-- Rempli par JS -->
            </div>

            <div class="p-4 bg-yoko-bg border-t border-white/5 flex gap-2">
                <input id="input-message" type="text" placeholder="Un message..." class="flex-1 bg-yoko-surface border border-white/10 rounded-full px-5 py-3 text-sm text-white focus:outline-none focus:border-yoko-secondary">
                <button id="btn-send-message" class="w-12 h-12 rounded-full bg-yoko-secondary text-yoko-bg flex items-center justify-center text-xl font-bold">
                    <i class="ph-fill ph-paper-plane-right"></i>
                </button>
            </div>
        </div>

        <!-- MODAL: LISTE DES UTILISATEURS -->
        <div id="modal-users" class="absolute inset-0 bg-yoko-bg/95 backdrop-blur-md z-[70] transform translate-y-full transition-transform duration-300 flex flex-col">
            <div class="flex items-center justify-between p-5 border-b border-white/5">
                <h2 class="text-xl font-bold">Trouver un ami</h2>
                <button id="btn-close-users" class="text-gray-400"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <div id="users-list" class="flex-1 overflow-y-auto p-4 space-y-2">
                <!-- Rempli par JS -->
            </div>
        </div>

        <!-- MODAL: PROFIL -->
        <div id="profile-modal" class="absolute inset-0 z-[80] flex flex-col bg-yoko-bg transform translate-y-full transition-transform duration-300">
            <div class="flex items-center justify-between px-6 py-5 border-b border-white/5 bg-yoko-surface/50">
                <button id="btn-close-profile" class="text-gray-400"><i class="ph ph-caret-down text-2xl"></i></button>
                <h2 class="text-xl font-bold text-white">Mon Profil</h2>
                <button id="btn-save-profile" class="text-yoko-primary font-semibold text-sm">Enregistrer</button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center gap-6">
                <label for="file-avatar" class="relative group cursor-pointer block">
                    <img id="modal-avatar" src="" class="w-32 h-32 rounded-full object-cover border-4 border-yoko-surface shadow-[0_0_20px_rgba(138,43,226,0.3)]">
                    <div class="absolute inset-0 bg-black/60 rounded-full flex flex-col items-center justify-center opacity-80">
                        <i class="ph-fill ph-camera text-3xl text-white mb-1"></i>
                    </div>
                    <input type="file" id="file-avatar" accept="image/jpeg, image/png" class="hidden">
                </label>

                <div class="w-full space-y-4 text-center">
                    <h3 id="display-pseudo" class="text-2xl font-bold uppercase tracking-wider text-yoko-secondary"></h3>
                    <button id="btn-logout" class="mt-8 px-6 py-2 border border-red-500/50 text-red-400 rounded-full text-sm font-semibold hover:bg-red-500/10 transition">Déconnexion</button>
                </div>
            </div>
        </div>
        
    </div>

    <!-- FIREBASE SDKs (Version 12.13.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // TA CONFIGURATION FIREBASE EXACTE
        const firebaseConfig = {
            apiKey: "AIzaSyBwhGrenegcMuo5KJLGQgEtOYMw5qpTWOw",
            authDomain: "yoko-2796c.firebaseapp.com",
            projectId: "yoko-2796c",
            storageBucket: "yoko-2796c.firebasestorage.app",
            messagingSenderId: "945399296331",
            appId: "1:945399296331:web:b3cf58858a1ae2f29b38ce",
            measurementId: "G-EFJL83QPKH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables Globales
        let currentUser = null;
        let myProfile = null;
        let allUsers = {};
        let myChats = [];
        let currentActiveChatId = null;

        // UI
        const elScreenLogin = document.getElementById('screen-login');
        const elLoginError = document.getElementById('login-error');
        
        // Compression Image Base64 Ultra-légère (Max 150px = ~10ko)
        const compressImage = (file, maxWidth = 150) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ratio = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * ratio;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); // Qualité 0.5
                    };
                };
            });
        };

        // --- HACK AUTHENTIFICATION PSEUDO + PIN ---
        // Firebase Auth demande un email/mdp. On transforme le pseudo en faux email.
        const formatCredentials = (pseudo, pin) => {
            const cleanPseudo = pseudo.toLowerCase().replace(/[^a-z0-9]/g, '');
            return {
                email: `${cleanPseudo}@yoko.app`,
                password: `${pin}yoko` // Doit faire 6 caractères mini pour Firebase
            };
        };

        // Inscription
        document.getElementById('btn-register').onclick = async () => {
            const pseudo = document.getElementById('login-pseudo').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            
            if (pseudo.length < 3 || pin.length !== 4) {
                elLoginError.innerText = "Erreur: Pseudo (3 char min) et PIN (4 chiffres) obligatoires.";
                elLoginError.classList.remove('hidden');
                return;
            }

            const creds = formatCredentials(pseudo, pin);
            try {
                const userCred = await createUserWithEmailAndPassword(auth, creds.email, creds.password);
                // Créer le document utilisateur public
                await setDoc(doc(db, 'users', userCred.user.uid), {
                    uid: userCred.user.uid,
                    pseudo: pseudo, // On garde la casse d'origine pour l'affichage
                    avatar: `https://placehold.co/150/1E1E1E/8A2BE2?text=${pseudo.charAt(0).toUpperCase()}`,
                    joinedAt: Date.now()
                });
            } catch (err) {
                console.error(err);
                if (err.code === 'auth/configuration-not-found') {
                    elLoginError.innerText = "Firebase: Va activer 'Email/Mot de passe' dans Firebase > Authentication.";
                } else if (err.code === 'auth/email-already-in-use') {
                    elLoginError.innerText = "Erreur: Ce pseudo est déjà utilisé.";
                } else {
                    elLoginError.innerText = "Erreur Firebase: " + err.message;
                }
                elLoginError.classList.remove('hidden');
            }
        };

        // Connexion
        document.getElementById('btn-login').onclick = async () => {
            const pseudo = document.getElementById('login-pseudo').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            
            if (!pseudo || !pin) return;
            const creds = formatCredentials(pseudo, pin);
            try {
                await signInWithEmailAndPassword(auth, creds.email, creds.password);
            } catch (err) {
                console.error(err);
                if (err.code === 'auth/configuration-not-found') {
                    elLoginError.innerText = "Firebase: L'authentification n'est pas activée sur ta console.";
                } else {
                    elLoginError.innerText = "Erreur: Pseudo ou code PIN incorrect.";
                }
                elLoginError.classList.remove('hidden');
            }
        };

        // Déconnexion
        document.getElementById('btn-logout').onclick = () => signOut(auth);

        // Ecouteur d'état d'authentification
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Récupérer le profil dans Firestore
                const profileSnap = await getDoc(doc(db, 'users', user.uid));
                if (profileSnap.exists()) {
                    myProfile = profileSnap.data();
                    elScreenLogin.classList.add('-translate-y-full'); // Cacher l'écran de login
                    
                    document.getElementById('header-avatar').src = myProfile.avatar;
                    document.getElementById('modal-avatar').src = myProfile.avatar;
                    document.getElementById('display-pseudo').innerText = myProfile.pseudo;
                    
                    startDataListeners();
                }
            } else {
                currentUser = null;
                myProfile = null;
                elScreenLogin.classList.remove('-translate-y-full');
            }
        });

        // --- ECOUTEURS DE DONNEES (FIRESTORE) ---
        const startDataListeners = () => {
            // Liste des utilisateurs
            onSnapshot(collection(db, 'users'), (snapshot) => {
                allUsers = {};
                document.getElementById('users-list').innerHTML = '';
                snapshot.forEach(d => {
                    const u = d.data();
                    allUsers[u.uid] = u;
                    if (u.uid !== currentUser.uid) {
                        const div = document.createElement('div');
                        div.className = "flex items-center justify-between p-3 bg-yoko-surface/50 rounded-xl";
                        div.innerHTML = `
                            <div class="flex items-center gap-3">
                                <img src="${u.avatar}" class="w-10 h-10 rounded-full border border-yoko-primary/30 object-cover">
                                <span class="font-bold text-white">${u.pseudo}</span>
                            </div>
                            <button class="text-yoko-primary font-bold text-sm bg-yoko-primary/10 px-4 py-1.5 rounded-full hover:bg-yoko-primary hover:text-white transition">Message</button>
                        `;
                        div.querySelector('button').onclick = () => openOrCreateChat(u.uid);
                        document.getElementById('users-list').appendChild(div);
                    }
                });
                renderChats();
            });

            // Liste de mes chats
            onSnapshot(collection(db, 'chats'), (snapshot) => {
                myChats = [];
                snapshot.forEach(d => {
                    const chat = d.data();
                    chat.id = d.id;
                    if (chat.participants && chat.participants.includes(currentUser.uid)) {
                        myChats.push(chat);
                    }
                });
                myChats.sort((a, b) => (b.lastUpdate || 0) - (a.lastUpdate || 0));
                renderChats();
            });
        };

        const renderChats = () => {
            const list = document.getElementById('chats-list');
            list.innerHTML = '';
            
            if(myChats.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 mt-10">Aucune discussion en cours.</div>';
                return;
            }

            myChats.forEach(chat => {
                const otherUid = chat.participants.find(id => id !== currentUser.uid);
                const otherUser = allUsers[otherUid] || { pseudo: 'Inconnu', avatar: 'https://placehold.co/100/333/FFF?text=?' };
                
                const lastMsg = chat.messages && chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : { text: 'Nouveau chat', type: 'text' };
                const isPing = lastMsg.type === 'ping';
                let msgPreview = lastMsg.senderId === currentUser.uid ? 'Vous: ' + lastMsg.text : lastMsg.text;

                const div = document.createElement('div');
                div.className = "flex items-center gap-4 p-3 rounded-2xl bg-yoko-surface/40 hover:bg-yoko-surface transition cursor-pointer border border-white/5";
                div.innerHTML = `
                    <img src="${otherUser.avatar}" class="w-14 h-14 rounded-full object-cover ${isPing ? 'ring-2 ring-yoko-primary neon-glow-primary' : ''}">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-semibold text-base truncate text-white">${otherUser.pseudo}</h3>
                        <p class="text-sm truncate font-medium ${isPing ? 'text-yoko-primary' : 'text-gray-400'}">${msgPreview}</p>
                    </div>
                `;
                div.onclick = () => openChatView(chat, otherUser);
                list.appendChild(div);
            });
        };

        const openOrCreateChat = async (targetUid) => {
            document.getElementById('modal-users').classList.add('translate-y-full');
            let chat = myChats.find(c => c.participants.includes(targetUid));
            
            if (!chat) {
                const newChatRef = doc(collection(db, 'chats'));
                chat = {
                    id: newChatRef.id,
                    participants: [currentUser.uid, targetUid],
                    messages: [],
                    lastUpdate: Date.now()
                };
                await setDoc(newChatRef, chat);
            }
            openChatView(chat, allUsers[targetUid]);
        };

        const openChatView = (chat, otherUser) => {
            currentActiveChatId = chat.id;
            document.getElementById('chat-header-name').innerText = otherUser.pseudo;
            document.getElementById('chat-header-avatar').src = otherUser.avatar;
            document.getElementById('screen-chat').classList.remove('translate-x-full');
            renderMessages(chat.messages || []);

            const lastM = chat.messages && chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : null;
            if (lastM && lastM.type === 'ping' && lastM.senderId !== currentUser.uid) {
                document.getElementById('app-wrapper').classList.add('flash-active');
                setTimeout(() => document.getElementById('app-wrapper').classList.remove('flash-active'), 1800);
            }
        };

        const renderMessages = (messagesArray) => {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            messagesArray.forEach(msg => {
                const isMe = msg.senderId === currentUser.uid;
                const isPing = msg.type === 'ping';
                
                const div = document.createElement('div');
                div.className = `max-w-[75%] rounded-2xl px-4 py-2 ${isMe ? 'bg-yoko-surface border border-white/10 text-white ml-auto rounded-tr-sm' : 'bg-yoko-primary/20 border border-yoko-primary/30 text-white mr-auto rounded-tl-sm'} ${isPing ? 'border-yoko-primary font-bold text-yoko-primary neon-text-primary uppercase tracking-widest text-center w-full max-w-full' : ''}`;
                div.innerText = msg.text;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        const sendMessageToDB = async (text, type = 'text') => {
            if (!text.trim() || !currentActiveChatId) return;
            const chatRef = doc(db, 'chats', currentActiveChatId);
            const currentChat = myChats.find(c => c.id === currentActiveChatId);
            
            // On limite à 50 messages pour ne pas exploser la limite de 1Mo de Firestore par document
            let newMessages = [...(currentChat.messages || []), { senderId: currentUser.uid, text: text, type: type, timestamp: Date.now() }];
            if (newMessages.length > 50) newMessages = newMessages.slice(-50);
            
            renderMessages(newMessages); 
            await updateDoc(chatRef, { messages: newMessages, lastUpdate: Date.now() });
        };

        // --- INTERACTIONS UI ---
        document.getElementById('btn-send-message').onclick = () => {
            sendMessageToDB(document.getElementById('input-message').value);
            document.getElementById('input-message').value = '';
        };

        document.getElementById('btn-send-ping').onclick = () => {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]); 
            sendMessageToDB('🚨 PING!', 'ping');
        };

        const swipeContainer = document.getElementById('swipe-container');
        document.getElementById('tab-messages').onclick = () => swipeContainer.scrollTo({ left: 0, behavior: 'smooth' });
        document.getElementById('tab-stories').onclick = () => swipeContainer.scrollTo({ left: window.innerWidth, behavior: 'smooth' });
        
        swipeContainer.addEventListener('scroll', () => {
            const isMsg = swipeContainer.scrollLeft < 50;
            document.getElementById('tab-messages').className = `cursor-pointer px-2 ${isMsg ? 'text-white border-b-2 border-yoko-primary pb-1' : 'text-gray-500'}`;
            document.getElementById('tab-stories').className = `cursor-pointer px-2 ${!isMsg ? 'text-white border-b-2 border-yoko-primary pb-1' : 'text-gray-500'}`;
        });

        document.getElementById('btn-close-chat').onclick = () => document.getElementById('screen-chat').classList.add('translate-x-full');
        document.getElementById('btn-open-users').onclick = () => document.getElementById('modal-users').classList.remove('translate-y-full');
        document.getElementById('btn-close-users').onclick = () => document.getElementById('modal-users').classList.add('translate-y-full');
        document.getElementById('btn-open-profile').onclick = () => document.getElementById('profile-modal').classList.remove('translate-y-full');
        document.getElementById('btn-close-profile').onclick = () => document.getElementById('profile-modal').classList.add('translate-y-full');

        document.getElementById('file-avatar').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const compressedBase64 = await compressImage(file, 150); // Compression ultra forte
            document.getElementById('modal-avatar').src = compressedBase64;
        });

        document.getElementById('btn-save-profile').onclick = async () => {
            const newAvatar = document.getElementById('modal-avatar').src;
            const profileRef = doc(db, 'users', currentUser.uid);
            await updateDoc(profileRef, { avatar: newAvatar });
            myProfile.avatar = newAvatar;
            document.getElementById('header-avatar').src = newAvatar;
            document.getElementById('profile-modal').classList.add('translate-y-full');
        };

    </script>
</body>
</html>
